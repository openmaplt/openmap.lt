services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: openmap-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - BASE_URL=${BASE_URL}
      - STVK_API_URL=${STVK_API_URL}
      - OSM_CLIENT_ID=${OSM_CLIENT_ID}
      - OSM_CLIENT_SECRET=${OSM_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    # Bind mount (not a named volume) on purpose: it's a plain host directory
    # that the deploy script never touches, so user-uploaded photos survive
    # every `docker compose down && up` across releases. See docs/DEPLOYMENT.md
    # for the one-time server-side setup this path needs.
    volumes:
      - ${UPLOADS_PATH:-./uploads}:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - openmap-network

networks:
  openmap-network:
    driver: bridge
